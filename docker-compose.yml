# docker-compose.yml (如没有就建一个)
services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: lawbot-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lawbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
